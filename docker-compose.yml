version: '3.9'

# ==========================================
# ManagerRate — Docker Compose
# ==========================================
# Usage:
#   cp .env.docker.example .env   (edit values!)
#   docker-compose up -d
#   docker-compose exec backend npx prisma migrate deploy
#   docker-compose exec backend npm run db:seed
#
# ⚠️  WARNING: You MUST create a .env file with real secrets before
#     running in production. See .env.docker.example for all required
#     variables. NEVER use default passwords in production.

services:
  # ==========================================
  # PostgreSQL 16 — Primary Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: managerrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-managerrate}
      POSTGRES_USER: ${POSTGRES_USER:-managerrate}
      # ⚠️  REQUIRED: Set DB_PASSWORD in your .env file — no default provided
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — set it in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-managerrate} -d ${POSTGRES_DB:-managerrate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - managerrate-net

  # ==========================================
  # Redis 7 — Rate Limiting & Caching
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: managerrate-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - managerrate-net

  # ==========================================
  # Backend — Node.js + Express + Prisma
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: managerrate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-managerrate}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-managerrate}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # ⚠️  REQUIRED: Set HASH_SALT in your .env file — no default provided
      HASH_SALT: ${HASH_SALT:?HASH_SALT is required — generate a random 64-char string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      REVIEW_RATE_LIMIT_MAX: ${REVIEW_RATE_LIMIT_MAX:-3}
      REVIEW_RATE_LIMIT_WINDOW_MS: ${REVIEW_RATE_LIMIT_WINDOW_MS:-3600000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - managerrate-net

  # ==========================================
  # Frontend — React + Vite + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: managerrate-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - managerrate-net

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# Internal Network
# ==========================================
networks:
  managerrate-net:
    driver: bridge
